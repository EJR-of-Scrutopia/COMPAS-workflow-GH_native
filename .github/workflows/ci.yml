name: Python checks

on:
  push:
    branches:
      - main
      - development
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Run dependency-light tests
        run: python -m pytest -q

  equilibrium-integration:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install pinned equilibrium stack
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,equilibrium]"

      - name: Run FD and TNA integration tests
        run: python -m pytest -q

      - name: Run headless workflow examples
        run: python examples/fd_catenary.py && python examples/tna_vault.py
