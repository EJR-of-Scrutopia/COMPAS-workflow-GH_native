manifest_version = 1

[plugin]
name = "Ananke Equilibrium"
package = "ananke-equilibrium"
module = "ananke_equilibrium"
category = "Ananke Equilibrium"
version = "0.1.0.dev0"
rhino_major = 8
project_guid = ""
license = "TBD"
guid_authority = "Rhino 8 Script Editor"

# This is the repository's component contract manifest. It is not the Yak
# manifest generated by Rhino Script Editor during publication.
#
# Empty GUID fields are intentional while the components are only planned.
# After creating a source Script component in Rhino, copy its immutable
# Instance ID here. Never invent, recycle, or regenerate a component GUID.

[[components]]
key = "network"
name = "Network"
nickname = "Network"
subcategory = "01 Inputs"
status = "v0.1-planned"
component_guid = ""
source_definition = "plugin/definitions/ananke_equilibrium_v01.gh"
source_script = "plugin/component_scripts/AE_Network.py"
inputs = [
  "Geometry:list[object]",
  "Kind:str",
  "AnalysisPlane:object",
  "Tolerance:float",
  "LengthUnit:str",
]
outputs = [
  "Topology:TopologyBundle",
  "Status:str",
]
breaking_successor = ""
notes = "Registers connected lines, polylines, or mesh-derived edges as one whole-object topology bundle."

[[components]]
key = "support_set"
name = "Support Set"
nickname = "Supports"
subcategory = "01 Inputs"
status = "v0.1-planned"
component_guid = ""
source_definition = "plugin/definitions/ananke_equilibrium_v01.gh"
source_script = "plugin/component_scripts/AE_SupportSet.py"
inputs = [
  "Topology:TopologyBundle",
  "Points:list[point]",
  "NodeIDs:list[int]",
  "Mode:str",
  "SnapTolerance:float",
]
outputs = [
  "Supports:SupportSet",
  "Status:str",
]
breaking_successor = ""
notes = "Collects form-finding supports without pretending they are FEA restraint degrees of freedom."

[[components]]
key = "load_case"
name = "Load Case"
nickname = "Loads"
subcategory = "01 Inputs"
status = "v0.1-planned"
component_guid = ""
source_definition = "plugin/definitions/ananke_equilibrium_v01.gh"
source_script = "plugin/component_scripts/AE_LoadCase.py"
inputs = [
  "Topology:TopologyBundle",
  "Points:list[point]",
  "NodeIDs:list[int]",
  "Vectors:list[vector]",
  "Distribution:str",
  "CaseName:str",
  "Factor:float",
]
outputs = [
  "Loads:LoadCase",
  "Status:str",
]
breaking_successor = ""
notes = "Maps nodal vectors to registered topology nodes and preserves a named load case."

[[components]]
key = "fd_settings"
name = "FD Settings"
nickname = "FD Settings"
