inputs = [
  "ForceDensity:object",
]
outputs = [
  "Config:FDConfig",
  "Status:str",
]
breaking_successor = ""
notes = "Bundles scalar or member-aligned force densities without adding display or load settings."

[[components]]
key = "tna_control"
name = "TNA Control"
nickname = "TNA Control"
subcategory = "02 Form Finding"
status = "v0.1-planned"
component_guid = ""
