]
outputs = [
  "Height:HeightControl",
  "Config:TNAConfig",
  "Status:str",
]
breaking_successor = ""
notes = "Collects height/force-scale choice and advanced TNA iteration controls in one reusable object."

[[components]]
key = "fd_solve"
name = "FD Solve"
nickname = "FD"
subcategory = "02 Form Finding"
status = "v0.1-planned"
