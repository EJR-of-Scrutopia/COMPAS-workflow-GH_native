[[components]]
key = "tna_solve"
name = "TNA Solve"
nickname = "TNA"
subcategory = "02 Form Finding"
status = "v0.1-planned"
component_guid = ""
source_definition = "plugin/definitions/ananke_equilibrium_v01.gh"
source_script = "plugin/component_scripts/AE_TNASolve.py"
inputs = [
  "Topology:TopologyBundle",
  "Supports:SupportSet",
  "Loads:LoadCase",
  "Height:HeightControl",
  "Config:TNAConfig",
]
outputs = [
  "Case:SolvedCase",
  "Status:str",
]
breaking_successor = ""
notes = "Requires a faced or otherwise TNA-compatible whole-object topology; it does not solve unrelated guide lines independently."

[[components]]
key = "validate"
name = "Validate"
