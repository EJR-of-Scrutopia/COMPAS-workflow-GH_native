[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ananke-equilibrium"
version = "0.1.0.dev0"
description = "Bundle-first COMPAS equilibrium workflows for Rhino 8 and Grasshopper."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "COMPAS",
    "Grasshopper",
    "graphic statics",
    "Rhino",
    "structural design",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
equilibrium = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "compas==2.15.1",
    "compas_fd==0.5.4",
    "compas_tna==0.7.0",
    "compas_ags==1.3.3",
]
model = [
    "compas_model==0.9.3",
]
fea = [
    "compas_fea2==0.2.1",
]
ifc = [
    "compas_ifc==2.1.0",
]
dev = [
    "build>=1.2,<2",
    "numpy==2.0.2",
    "pytest>=8,<10",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/EJR-of-Scrutopia/COMPAS-workflow-GH_native"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ananke_equilibrium",
    "src/tree_forest_compas",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/docs",
    "/examples",
    "/plugin",
    "/pyproject.toml",
    "/scripts",
    "/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
