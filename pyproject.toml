[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ananke-equilibrium"
version = "0.1.0.dev0"
description = "Bundle-first COMPAS equilibrium workflows for Rhino 8 and Grasshopper."
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "COMPAS",
    "Grasshopper",
    "graphic statics",
    "Rhino",
    "structural design",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
equilibrium = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "compas==2.15.1",
    "compas_fd==0.5.4",
    "compas_tna==0.7.0",
    "compas_ags==1.3.3",
]
model = [
    "compas_model==0.9.3",
]
fea = [
    "compas_fea2==0.2.1",
]
ifc = [
    "compas_ifc==2.1.0",
]
# Masonry: block tessellation, contact assembly, and coupled rigid-block
# stability. compas_dem pulls compas_cgal, compas_libigl, and compas_model.
# Backs the "04 Masonry" tab.
masonry = [
    "compas_dem==0.5.0",
    "compas_assembly==0.7.1",
    "compas_cra==0.4.0",
]
# Digital fabrication: robot models and kinematics. Analytical inverse
# kinematics needs no further backend; PyBullet and ROS/MoveIt are opt-in.
# Backs the "07 Fabrication" tab.
fab = [
    "compas_fab==2.0.1",
    "compas_robots==1.0.1",
]
# Patterns: backs the Skeleton mode that TNA Pattern currently rejects.
patterns = [
    "compas_skeleton==2.0.1",
]
# Headless diagrams. matplotlib only; no display server needed.
plot = [
    "matplotlib>=3.8",
]
# Interactive 3D. PySide6 is large and Rhino never imports it, so it is
# opt-in and must not move the pinned numpy, scipy, or compas.
viz = [
    "compas_viewer==2.0.2",
]
dev = [
    "build>=1.2,<2",
    "numpy==2.0.2",
    "pytest>=8,<10",
    "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/EJR-of-Scrutopia/COMPAS-workflow-GH_native"

[project.scripts]
ananke = "ananke_equilibrium.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ananke_equilibrium",
    "src/tree_forest_compas",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/docs",
    "/examples",
    "/plugin",
    "/pyproject.toml",
    "/scripts",
    "/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
