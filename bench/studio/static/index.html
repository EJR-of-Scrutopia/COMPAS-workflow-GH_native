<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bench Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/studio.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="event-log"></div>
<div id="banner" class="hidden"><span id="banner-text"></span><span id="banner-close">&#10005;</span></div>
<div id="cut-overlay" class="hidden"><div id="cut-spinner"></div><div id="cut-status"></div></div>
<div id="legend" class="hidden">
  <div id="legend-title"></div>
  <div id="legend-bar"></div>
  <div id="legend-labels"><span id="legend-min"></span><span id="legend-zero"></span><span id="legend-max"></span></div>
</div>
<aside id="panel">
  <details id="import-section">
    <summary>Import</summary>
    <label>Grasshopper export pair (*-contract.json + *-compas.json)
      <input id="import-export-input" type="file" multiple accept=".json"></label>
    <button id="import-export-button">Upload export pair</button>
    <label>Column geometry
      <input id="import-columns-input" type="file" accept=".json"></label>
    <button id="import-columns-button">Upload columns file</button>
    <div id="import-status"></div>
  </details>
  <details id="study-section" open>
    <summary>Study</summary>
    <select id="study-select"></select>
    <button id="live-toggle" class="on" title="Live: reload this study as Grasshopper pushes it"><span class="beacon"></span>LIVE</button>
    <button id="delete-study" title="Delete this study and its files">Delete</button>
    <select id="material-select">
      <option value="concrete">Concrete C30/37</option>
      <option value="concrete-c50">Concrete C50/60</option>
      <option value="concrete-sprayed">Sprayed concrete C25/30</option>
      <option value="timber">Timber GL24h</option>
      <option value="brick">Brick masonry</option>
      <option value="tile">Fired clay tile</option>
      <option value="stone">Limestone</option>
    </select>
    <label>Render skin <select id="render-skin">
      <option value="none" selected>None (material)</option>
      <option value="white-presentation">White presentation</option>
      <option value="basalt-dark">Basalt dark</option>
      <option value="timber-ply">Timber ply</option>
    </select></label>
    <label>Tint <input id="material-tint" type="color" value="#ffffff"></label>
    <label>Finish <input id="material-finish" type="range" min="0.3" max="1" step="0.01" value="0.5"> <span id="material-finish-value">50</span></label>
    <button id="material-reset">Reset appearance</button>
    <div id="appearance-note">Skin, tint and finish are render tint only, analysis unchanged: none of it reaches the server.</div>
    <label id="source-row" class="hidden">Cut from
      <select id="source-select">
        <option value="authored">the Grasshopper Skin</option>
        <option value="generated">the studio pattern</option>
      </select>
      <span id="source-note"></span>
    </label>
    <select id="pattern-select"></select>
    <div id="pattern-note"></div>
    <label>Piece size <input id="size-slider" type="range" min="0.3" max="3" step="0.05" value="0.9">
      <span id="size-value">900</span><span id="size-units"> mm target</span>, <span id="piece-count">0</span> pieces in
      <span id="course-count">0</span> courses</label>
    <label>Thickness <input id="thickness-input" type="range" min="0.1" max="0.4" step="0.01" value="0.2"> <span id="thickness-value">200</span> mm</label>
    <label>Joint gap <input id="joint-gap" type="range" min="0" max="0.06" step="0.005" value="0.02"> <span id="joint-gap-value">20</span> mm at the widest corner, less nearer the centre<span id="joint-gap-note"></span></label>
    <label>Crown taper <input id="taper" type="range" min="0" max="0.5" step="0.05" value="0"> <span id="taper-value">0</span> %</label>
  </details>
  <details id="analysis-section">
    <summary>Analysis</summary>
    <button id="run-button">Run staged analysis</button>
    <div id="run-status"></div>
    <div id="layer-toggles"></div>
    <label>Stress surface <select id="stress-surface">
      <option value="per" selected>Per surface</option>
      <option value="worst">Worst of both</option>
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
    </select></label>
    <label>Deflection exaggeration <input id="exaggeration" type="range" min="1" max="500" step="1" value="100"></label>
    <button id="data-button">Data</button>
  </details>
  <details id="view-section" open>
    <summary>View</summary>
    <label>Show <select id="show-mode">
      <option value="framework">Framework</option>
      <option value="shell">Shell</option>
      <option value="both">Both</option>
      <option value="timeline" selected>Timeline</option>
    </select></label>
    <label>Formwork <select id="formwork-mode">
      <option value="animation">Animation</option>
      <option value="always">Always</option>
      <option value="hidden" selected>Hidden</option>
    </select></label>
    <label>Node size <input id="node-radius" type="range" min="0.01" max="0.10" step="0.005" value="0.03"> <span id="node-radius-value">30</span> mm</label>
    <label>Wire size <input id="wire-radius" type="range" min="0.005" max="0.06" step="0.005" value="0.02"> <span id="wire-radius-value">20</span> mm</label>
  </details>
  <details id="animation-section" open>
    <summary>Animation</summary>
    <button id="play-button">Play</button>
    <button id="restart-button">Restart</button>
    <label>Timeline <input id="timeline-scrubber" type="range" min="0" max="1000" step="1" value="0"></label>
    <label>Timeline speed <input id="timeline-speed" type="range" min="0.25" max="4" step="0.05" value="1"> <span id="timeline-speed-value">1.00</span>x</label>
    <label>Inflation <input id="inflate-seconds" type="range" min="0" max="10" step="0.5" value="3"> <span id="inflate-value">3.0</span> s</label>
    <label>Orbit speed <input id="orbit-speed" type="range" min="0" max="2" step="0.1" value="0.3"></label>
    <label>Orbit distance <input id="orbit-distance" type="range" min="10" max="60" step="1" value="30"></label>
    <button id="record-button">Record 1080p</button>
    <div id="record-status"></div>
  </details>
  <details id="scene-section">
    <summary>Scene</summary>
    <label>Environment <select id="environment-mode">
      <option value="studio" selected>Studio</option>
      <option value="sky">Sky</option>
      <option value="hdri">HDRI</option>
    </select></label>
    <label id="weather-row" class="hidden">Weather <select id="weather-preset">
      <option value="clear" selected>Clear</option>
      <option value="hazy">Hazy</option>
      <option value="overcast">Overcast</option>
      <option value="golden-hour">Golden hour</option>
      <option value="night">Night</option>
    </select></label>
    <div id="hdri-row" class="hidden">
      <label>HDRI <select id="hdri-select"></select></label>
      <label>Upload .hdr <input id="hdri-upload" type="file" accept=".hdr"></label>
      <div id="hdri-status"></div>
      <label>Projection <select id="hdri-projection">
        <option value="projected" selected>Projected</option>
        <option value="infinite">Infinite</option>
      </select></label>
      <label id="hdri-scale-row">Scale <input id="hdri-scale" type="range" min="10" max="300" step="5" value="60"></label>
      <label id="hdri-height-row">Height <input id="hdri-height" type="range" min="0.5" max="20" step="0.5" value="2"></label>
      <label>Rotation <input id="hdri-rotation" type="range" min="0" max="360" step="1" value="0"></label>
    </div>
    <label>Sun azimuth <input id="sun-azimuth" type="range" min="0" max="360" step="1" value="140"></label>
    <label>Sun elevation <input id="sun-elevation" type="range" min="5" max="85" step="1" value="40"></label>
    <label>Sun colour <input id="sun-colour" type="color" value="#ffffff"></label>
    <div id="day-cycle-row">
      <button id="day-cycle-button">Day cycle</button>
      <label>Length <input id="day-cycle-seconds" type="range" min="10" max="120" step="5" value="30"></label>
      <label><input id="day-cycle-record" type="checkbox"> During recordings</label>
    </div>
    <label id="background-row">Background <input id="background-tone" type="range" min="0" max="100" step="1" value="85"></label>
    <label>Brightness <input id="brightness" type="range" min="0.3" max="2" step="0.05" value="1"></label>
    <label>Contrast <input id="contrast" type="range" min="-0.5" max="0.5" step="0.02" value="0"></label>
    <div id="scene-row">
      <button id="scene-save">Save scene</button>
      <button id="scene-open">Scenes</button>
      <button id="clear-scene" title="Empty the viewport and deselect">Clear scene</button>
      <span id="scene-count"></span>
    </div>
    <div id="scene-list" class="hidden"></div>
    <label>Ground <select id="ground-preset">
      <option value="dark-studio" selected>Dark studio</option>
      <option value="concrete-slab">Concrete slab</option>
      <option value="patio-pavers">Patio pavers</option>
      <option value="tiles">Tiles</option>
    </select></label>
    <label>Ground size <input id="ground-radius" type="range" min="2" max="200" step="1" value="60"> <span id="ground-radius-value">60</span> m radius</label>
    <div id="props-row">
      <span>Props</span>
      <button id="prop-figure">Figure</button>
      <button id="prop-tree">Tree</button>
      <button id="prop-pallets">Pallets</button>
      <button id="prop-barrier">Barrier</button>
      <button id="prop-cone">Cone</button>
      <button id="props-clear">Clear props</button>
    </div>
  </details>
</aside>
<div id="data-panel" class="hidden"><button id="data-close">Close</button><div id="data-content"></div></div>
<script type="module" src="/static/studio.js"></script>
</body>
</html>
