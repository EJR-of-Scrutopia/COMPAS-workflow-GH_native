<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vaulted</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/studio.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="event-log"></div>
<div id="banner" class="hidden"><span id="banner-text"></span><span id="banner-close">&#10005;</span></div>
<div id="cut-overlay" class="hidden"><div id="cut-spinner"></div><div id="cut-status"></div></div>
<div id="loading-toast" class="hidden"><span id="loading-spin"></span><span id="loading-toast-text">Loading</span></div>
<!-- The shelf: the bottom asset drawer (the pattern Blender's asset shelf
     and Quixel Bridge settled on). Collapsed it is three quiet pills;
     expanded, a four-column grid with category chips and its own scroll,
     so choosing an asset stops being a squint into the side panel. -->
<div id="shelf">
  <div id="shelf-body" class="hidden">
    <div id="shelf-head">
      <div id="shelf-cats"></div>
      <div id="shelf-actions">
        <button id="shelf-assign-skin" class="hidden" title="Wear this material on the vault">Assign to skin</button>
        <button id="shelf-assign-ground" class="hidden" title="Lay this material on the floor">Assign to ground</button>
        <button id="scene-save" class="hidden" title="Save the viewport, the floor, the light and everything placed">Save scene</button>
        <!-- The same toggle as the panel's Edit, put where the props are
             actually being chosen (Param: "we should also put the edit
             button on the layers tile too"). Both buttons drive
             setPropEdit, so they can never disagree. -->
        <button id="shelf-prop-edit" class="hidden" title="Move, rotate and scale the placed props: click one to pick it up, R rotates, + and - scale, Delete removes">Edit</button>
        <button id="stamp-group" class="hidden" title="Pick up the selected objects as one stamp: every click places a copy, Escape lets go" disabled>Place copies</button>
        <button id="layer-group" class="hidden" title="Move the selected objects onto a fresh layer of their own" disabled>Group to new layer</button>
      </div>
      <button id="shelf-close" title="Collapse">&#10005;</button>
    </div>
    <div id="shelf-sky-settings" class="hidden">
      <label class="named"><span>Projection</span> <select id="hdri-projection">
        <option value="projected" selected>Projected</option>
        <option value="infinite">Infinite</option>
      </select></label>
      <label id="hdri-scale-row">Scale <input id="hdri-scale" type="range" min="10" max="300" step="5" value="60"></label>
      <label id="hdri-height-row">Height <input id="hdri-height" type="range" min="0.5" max="20" step="0.5" value="2"></label>
      <label>Rotation <input id="hdri-rotation" type="range" min="0" max="360" step="1" value="0"></label>
    </div>
    <div id="prop-tiles" class="tile-grid hidden"></div>
    <div id="shelf-grid" class="tile-grid hidden"></div>
    <div id="scene-list" class="hidden"></div>
    <div id="prop-credit"></div>
    <!-- The layer tabs: the drawer's bottom edge. The open tab is where
         newly placed props land; the eye hides a whole layer. -->
    <div id="layer-tabs" class="hidden"></div>
  </div>
  <div id="shelf-tabs">
    <button id="shelf-undo" class="shelf-act" title="Nothing to undo yet" disabled>&#8630;</button>
    <button data-shelf="props" title="Browse and place props">Props</button>
    <button data-shelf="materials" title="Browse materials, assign to the skin or the floor">Materials</button>
    <button data-shelf="skies" title="Browse skies: click one to light the scene">Skies</button>
    <button data-shelf="layers" title="Group placed props: show, hide, duplicate whole sets">Layers</button>
    <button data-shelf="scenes" title="Save, restore and delete whole scenes">Scenes</button>
    <!-- A mode, not a drawer (Param: "just a button you press it
         highlights and no pop up"). It deliberately carries no
         data-shelf, so openShelf and closeShelf leave it alone and it
         keeps its own lit state while any drawer comes and goes. -->
    <button id="shelf-edit-tile" title="Edit mode: click a prop to pick it up, R rotates, + and - scale, Delete removes">Edit</button>
    <button id="shelf-play" class="shelf-act" title="Play the animation">&#9654;</button>
    <button id="shelf-restart" class="shelf-act" title="Play again from the start">&#8635;</button>
    <button id="shelf-record" class="shelf-act" title="Record the animation">&#9679;</button>
  </div>
</div>
<div id="legend" class="hidden">
  <div id="legend-title"></div>
  <div id="legend-bar"></div>
  <div id="legend-labels"><span id="legend-min"></span><span id="legend-zero"></span><span id="legend-max"></span></div>
</div>
<!-- One button per panel section, on the viewport beside the panel.
     Param: "at the top right of the viewport besides the menu we should
     have a translucentish button one for each section... when a button is
     clicked that information is all that is shown." The panel keeps a
     permanent header (theme, build stamp) and footer (views, restart);
     the middle is whichever section's tab is lit. -->
<nav id="tab-rail">
  <button data-section="import-section" type="button">Import</button>
  <button data-section="study-section" type="button">Skin</button>
  <button data-section="analysis-section" type="button">Analysis</button>
  <button data-section="animation-section" type="button">Animation</button>
  <button data-section="camera-section" type="button">Camera</button>
  <button data-section="scene-section" type="button">Scene</button>
</nav>
<aside id="panel">
  <div id="panel-top">
    <button id="theme-toggle" type="button" title="Light or dark">Light</button>
    <span id="build-stamp" title="Which build this page is running. If it does not change after an edit, the page is cached.">__BUILD__</span>
  </div>
  <details id="import-section">
    <summary>Import</summary>
    <div id="folder-row" class="folder-line">
      <button id="folder-choose" title="Pick the folder your vault JSONs are saved in">Vault folder</button>
      <span id="folder-path" title="">no folder chosen</span>
    </div>
    <div id="vault-row">
      <select id="study-select"></select>
      <button id="study-refresh" title="Re-read the folder for new saves">Refresh</button>
    </div>
    <div id="vault-tools">
      <button id="live-toggle" class="on" title="Live: follow Grasshopper"><span class="beacon"></span>LIVE</button>
      <button id="delete-study" class="danger" title="Delete this vault's JSON from the folder">Delete</button>
    </div>
    <div id="source-row" class="hidden">
      <span class="row-heading">Cut</span>
      <div class="switch-line">
        <span class="toggle-end" id="source-end-authored">Grasshopper</span>
        <label class="toggle"><input id="source-toggle" type="checkbox"><span class="track"></span></label>
        <span class="toggle-end" id="source-end-generated">Engine</span>
      </div>
    </div>
    <div id="import-status"></div>
  </details>
  <details id="study-section" open>
    <summary>Skin</summary>
    <!-- The structural-material picker is gone from view: the weight
         system derives the material from the chosen skin, and the sprayed
         distinction moved to the Pattern control. The hidden select below
         remains the state the server contract reads. -->
    <button id="material-picker" class="picker hidden" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Material</span><span class="chevron"></span></button>
    <div id="material-tiles" class="tile-grid hidden"></div>
    <select id="material-select" class="hidden">
      <option value="concrete">Concrete C30/37</option>
      <option value="concrete-c50">Concrete C50/60</option>
      <option value="concrete-sprayed">Sprayed concrete C25/30</option>
      <option value="timber">Timber GL24h</option>
      <option value="brick">Brick masonry</option>
      <option value="tile">Fired clay tile</option>
      <option value="stone">Limestone</option>
    </select>
    <button id="skin-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Render skin</span><span class="chevron"></span></button>
    <!-- The folder feeds the render-skin library below it, not the built-in
         structural materials above: source row above the grid it fills,
         the same order the sky and prop folders already follow. -->
    <div id="material-folder-row" class="folder-line">
      <button id="material-folder-choose" title="Pick your material library folder">Material folder</button>
      <span id="material-folder-path" title="">no folder chosen</span>
    </div>
    <input id="skin-search" type="search" class="hidden" placeholder="Search materials">
    <div id="skin-tiles" class="tile-grid hidden"></div>
    <!-- The three procedural presets (white presentation, basalt, ply) are
         gone on Param's word: the library is the skin catalogue now, and
         "None (material)" is the one built-in -- the structural material's
         own plain look. -->
    <select id="render-skin" class="hidden">
      <option value="none" selected>None (material)</option>
    </select>
    <label>Tint <input id="material-tint" type="color" value="#ffffff"></label>
    <label>Shine <input id="material-finish" type="range" min="0.3" max="1" step="0.01" value="0.5"> <span id="material-finish-value">50</span></label>
    <label>Relief <input id="material-relief" type="range" min="0" max="4" step="0.05" value="1"> <span id="material-relief-value">10</span> mm</label>
    <label>Occlusion <input id="material-occlusion" type="range" min="0" max="2" step="0.05" value="1"> <span id="material-occlusion-value">100</span>%</label>
    <label>Variation <input id="material-variation" type="range" min="0" max="2" step="0.05" value="1"> <span id="material-variation-value">100</span>%</label>
    <label title="Run the picture's grain up the slope of each voussoir, the way boards would be laid along each leg"><input id="material-grain" type="checkbox"> Match grain</label>
    <button id="uv-randomise" title="Re-deal every voussoir's window of the sheet so no two wear the same patch">Randomise texture</button>
    <button id="material-reset">Reset appearance</button>
    <div id="appearance-note" class="hidden"></div>
    <div class="named"><span>Pattern</span><select id="pattern-select"></select></div>
    <div id="pattern-note"></div>
    <label>Piece size <input id="size-slider" type="range" min="0.1" max="3" step="0.05" value="0.9">
      <span id="size-value">900</span><span id="size-units"> mm target</span>, <span id="piece-count">0</span> pieces in
      <span id="course-count">0</span> courses</label>
    <label>Thickness <input id="thickness-input" type="range" min="0.02" max="0.5" step="0.01" value="0.2"> <span id="thickness-value">200</span> mm</label>
    <div id="weight-note" title="Areal load from the skin's density and the thickness: the q a true analysis runs on"></div>
  </details>
  <details id="analysis-section">
    <summary>Analysis</summary>
    <button id="run-button" class="primary">Run staged analysis</button>
    <div id="run-status"></div>
    <div id="layer-toggles"></div>
    <label class="named"><span>Stress surface</span> <select id="stress-surface">
      <option value="per" selected>Per surface</option>
      <option value="worst">Worst of both</option>
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
    </select></label>
    <!-- Parked here hidden; buildLayerToggles moves it under the
         Deflection button when that layer is active, so the slider lives
         with the thing it exaggerates. -->
    <label id="exaggeration-row" class="hidden">Deflection exaggeration <input id="exaggeration" type="range" min="1" max="500" step="1" value="100"></label>
    <button id="data-button">Data</button>
    <!-- The old floating overlay card, reading in place under the Data
         button now (Param: "text that just reads below the data button"). -->
    <div id="hud"></div>
    <!-- Not one of the lenses: an annotation, tucked at the bottom. -->
    <label id="overlays-tuck"><input id="overlays-box" type="checkbox"> Text overlays</label>
  </details>
  <details id="animation-section" open>
    <summary>Animation</summary>
    <button id="play-button">Play</button>
    <button id="restart-button">Restart</button>
    <label>Timeline <input id="timeline-scrubber" type="range" min="0" max="1000" step="1" value="0"></label>
    <label>Timeline speed <input id="timeline-speed" type="range" min="0.25" max="4" step="0.05" value="1"> <span id="timeline-speed-value">1.00</span>x</label>
    <label>Spin rate <input id="orbit-speed" type="range" min="0" max="2" step="0.1" value="0.3"></label>
    <button id="record-button" class="primary">Record 1080p</button>
    <div id="record-status"></div>
  </details>
  <details id="camera-section">
    <summary>Camera</summary>
    <label>Field of view <input id="camera-fov" type="range" min="15" max="100" step="1" value="45"> <span id="camera-fov-value">45</span>&deg; &#8776; <span id="camera-mm">29</span> mm</label>
    <!-- The frame: preset screen ratios, letterboxed live and honoured by
         the recording. Fill is the whole viewport, as it always was. -->
    <select id="camera-aspect" class="hidden" title="Frame ratio">
      <option value="fill" selected>Fill</option>
      <option value="1.7778">16:9</option>
      <option value="1.3333">4:3</option>
      <option value="1">1:1</option>
      <option value="0.8">4:5</option>
      <option value="0.5625">9:16</option>
    </select>
    <div id="camera-aspect-segments" class="segmented"></div>
    <label>Brightness <input id="brightness" type="range" min="0.3" max="2" step="0.05" value="1"></label>
    <label>Contrast <input id="contrast" type="range" min="-0.5" max="0.5" step="0.02" value="0"></label>
  </details>
  <details id="scene-section">
    <summary>Scene</summary>
    <!-- Group order is the order a renderer user works in: the light (sun,
         then the sky feeding it), the image those two produce, then the
         world under the vault (ground, props), and last the scenes that
         capture the lot -- a capture-everything control at the boundary of
         what it captures, not in the middle of it. -->
    <span class="row-heading">Sun</span>
    <div id="sun-widget">
      <canvas id="sun-dial" width="234" height="150"></canvas>
      <div id="sun-readout"><span id="sun-time">12:00</span><span id="sun-angles">180 / 60</span></div>
    </div>
    <canvas id="day-track" width="234" height="24"></canvas>
    <div id="day-cycle-row">
      <button id="day-cycle-button">Day cycle</button>
      <label><input id="day-cycle-record" type="checkbox"> During recordings</label>
      <input id="day-cycle-seconds" type="range" min="10" max="120" step="5" value="30" class="hidden">
    </div>
    <input id="sun-azimuth" type="range" min="0" max="360" step="1" value="140" class="hidden">
    <input id="sun-elevation" type="range" min="5" max="85" step="1" value="40" class="hidden">
    <input id="sun-colour" type="color" value="#ffffff" class="hidden">

    <span class="row-heading">Environment</span>
    <div id="environment-segments" class="segmented"></div>
    <label class="hidden">Setting <select id="environment-mode">
      <option value="studio" selected>Studio</option>
      <option value="sky">Sky</option>
      <option value="hdri">HDRI</option>
    </select></label>
    <button id="weather-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Weather</span><span class="chevron"></span></button>
    <div id="weather-tiles" class="tile-grid hidden"></div>
    <label id="weather-row" class="hidden">Weather <select id="weather-preset">
      <option value="clear" selected>Clear</option>
      <option value="hazy">Hazy</option>
      <option value="overcast">Overcast</option>
      <option value="golden-hour">Golden hour</option>
      <option value="night">Night</option>
    </select></label>
    <div id="hdri-row" class="hidden">
      <div id="hdri-folder-row" class="folder-line">
        <button id="hdri-folder-choose" title="Pick the folder your HDRIs are in">Sky folder</button>
        <span id="hdri-folder-path" title="">no folder chosen</span>
      </div>
      <button id="hdri-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Sky</span><span class="chevron"></span></button>
    <div id="hdri-tiles" class="tile-grid hidden"></div>
      <label class="hidden">HDRI <select id="hdri-select"></select></label>
      <div id="hdri-status"></div>
      <!-- Projection, scale, height and rotation moved to the shelf's
           Skies drawer: they belong beside the pictures they tune. -->
    </div>
    <label id="background-row">Background <input id="background-tone" type="range" min="0" max="100" step="1" value="85"></label>

    <!-- Brightness and contrast moved to the Camera section: they are
         the grade on the lens, not the light in the scene. -->

    <span class="row-heading">Ground</span>
    <div id="ground-folder-row" class="folder-line">
      <button id="ground-folder-choose" title="Pick your ground material folder">Ground folder</button>
      <span id="ground-folder-path" title="">no folder chosen</span>
    </div>
    <button id="ground-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Surface</span><span class="chevron"></span></button>
    <input id="ground-search" type="search" class="hidden" placeholder="Search surfaces">
    <div id="ground-tiles" class="tile-grid hidden"></div>
    <!-- Only the neutral studio floor remains built in; every real surface
         comes from the ground library folder. -->
    <label class="hidden">Surface <select id="ground-preset">
      <option value="dark-studio" selected>Dark studio</option>
    </select></label>
    <label>Size <input id="ground-radius" type="range" min="2" max="200" step="1" value="60"> <span id="ground-radius-value">60</span> m radius</label>
    <label>Scale <input id="ground-scale" type="range" min="0.05" max="4" step="0.05" value="1"> <span id="ground-scale-value">100</span>%</label>
    <label>Relief <input id="ground-relief" type="range" min="0" max="4" step="0.05" value="1"> <span id="ground-relief-value">10</span> mm</label>
    <button id="ground-randomise" title="Turn and slide the floor pattern to a fresh lay angle">Randomise floor</button>

    <span class="row-heading">Props</span>
    <div id="props-folder-row" class="folder-line">
      <button id="props-folder-choose" title="Pick the folder your prop models are in">Prop folder</button>
      <span id="props-folder-path" title="">no folder chosen</span>
    </div>
    <div id="props-row">
      <button id="prop-browse" title="Choose a prop and carry it">Library</button>
      <button id="prop-edit" title="Move, rotate and scale the placed props: click one to pick it up, R rotates, + and - scale, Delete removes">Edit</button>
      <button id="props-clear" class="danger" title="Remove every placed prop">Clear</button>
    </div>
    <!-- The prop grid lives in the shelf now: see #shelf at body level. -->
    <select id="prop-type" class="hidden"></select>

    <span class="row-heading">Scenes</span>
    <!-- No viewport-clearing button here any more. Two buttons named Clear
         sat a row apart and the scene one emptied the whole viewport --
         vault, ground, the lot. Param: "no just have it remove the props
         please." The props Clear is the one Clear; clearScene() remains a
         function for study switching, not a button. -->
    <!-- Scenes live in the shelf's Scenes drawer now: saving, restoring
         and deleting all happen beside the pictures of the scenes. -->
  </details>
  <div id="mode-row">
    <button id="show-formwork" class="mode" title="The net and the machine alone">Formwork</button>
    <button id="show-shell" class="mode" title="The vault alone">Shell</button>
    <button id="show-both" class="mode active" title="The vault on its formwork">Both</button>
  </div>
  <div id="panel-foot">
    <button id="restart-studio" title="Restart the server and reload this page on the new build">Restart studio</button>
    <button id="stop-studio" title="Stop the server on the desktop; every open page loses it until it is started again">Stop server</button>
    <button id="start-studio" hidden title="Ask the desktop to start the studio again, then reload onto it">Start server</button>
    <span id="restart-status"></span>
  </div>
</aside>
<!-- The panel's own handle: a slim tile on its mid-left edge. One press
     slides the whole banner (and its tab rail) off to the right, the next
     brings it back; the handle itself stays put on the screen edge. -->
<button id="panel-collapse" title="Collapse the panel">&#8250;</button>
<div id="data-panel" class="hidden"><button id="data-close">Close</button>
  <!-- Analysis leads (Param: "another tab heading which comes up first...
       this new analysis tab actually helps us make sense of the data");
       Overview is the raw sheet as it always was; Graphs draws the staged
       story with the vendored plotting library, loaded only when asked. -->
  <div id="data-tabs">
    <button data-tab="data-analysis" class="active" type="button">Analysis</button>
    <button data-tab="data-content" type="button">Overview</button>
    <button data-tab="data-graphs" type="button">Graphs</button>
  </div>
  <div id="data-analysis" class="data-tab"></div>
  <div id="data-content" class="data-tab hidden"></div>
  <div id="data-graphs" class="data-tab hidden"></div>
</div>
<!-- Two checks that must not live in studio.js, because the fault they
     exist for is a studio.js the browser is serving from its own cache. The
     page is read from disk by every server on every request, so this is the
     one place a stale copy cannot reach. -->
<script>
(function () {
  // Styled inline, every property of it. This notice exists for the case
  // where the stylesheet is the stale file, and a rule in studio.css would
  // be the first casualty: an unstyled div appended to the end of the body
  // sits below a panel several screens long, off the bottom of the window.
  // Reported exactly so -- the check was right, the notice was invisible.
  function shout(html) {
    if (document.getElementById("stale-server")) return;
    var notice = document.createElement("div");
    notice.id = "stale-server";
    // The literals mirror the tokens in studio.css (--danger, --radius,
    // the 4/8/12/16 spacing scale); they cannot reference them, because
    // this notice exists for the case where that stylesheet never arrived.
    notice.setAttribute("style", [
      "position:fixed", "left:50%", "top:12px", "transform:translateX(-50%)",
      "z-index:2147483647", "max-width:680px", "padding:12px 16px",
      "border-radius:4px", "background:#7a2b20", "color:#fff",
      "font:14px/1.5 system-ui,sans-serif",
      "box-shadow:0 8px 30px rgba(0,0,0,0.5)",
    ].join(";"));
    notice.innerHTML = html;
    (document.body || document.documentElement).appendChild(notice);
  }

  // A stamp still reading the placeholder was not filled in, which means
  // the page was not served by the route that fills it in, which means the
  // server is older than that route. Everything else is downstream: the
  // folder routes answer 404, and the browser is handed un-versioned asset
  // URLs its own cache can satisfy with yesterday's files.
  document.addEventListener("DOMContentLoaded", function () {
    var stamp = document.getElementById("build-stamp");
    // Assembled, never written whole. The server fills the placeholder in
    // with a replace-every-occurrence, so a literal here would be rewritten
    // to the stamp itself and this test would ask whether the stamp differs
    // from the stamp: never true, so the warning fired on every load. A
    // self-check whose own text is rewritten by the thing it checks is a
    // trap worth two lines of awkwardness to close.
    var placeholder = "__" + "BUILD" + "__";
    if (!stamp || stamp.textContent.trim() !== placeholder) return;

    // Two causes, and they need different answers. Either the BROWSER is
    // holding an old copy of this page, which the page can cure itself by
    // asking for an address the cache has never seen; or the SERVER is old
    // and does not fill the stamp in at all, which no reload will fix.
    // They are indistinguishable until the first is tried, so try it, once.
    if (location.search.indexOf("fresh=") === -1) {
      location.replace(location.pathname + "?fresh=" + Date.now());
      return;
    }

    // A guaranteed-fresh fetch came back with the placeholder still in it,
    // so this is the server and not the cache.
    stamp.textContent = "stale";
    stamp.className = "stale";
    shout("<b>The server is older than this page.</b> It is not filling in "
      + "the build stamp, which means it started before that was added, and "
      + "it is handing the browser un-versioned files. Close its window and "
      + "run <code>bench/studio/serve.py</code> again. If its window is "
      + "already gone, the process is still running: the new one will stop "
      + "it for you.");
  });

  // A module-level throw halfway down studio.js leaves half a panel built
  // and the rest silently never built, which looks merely disappointing
  // rather than broken. Registered before the module loads, so it catches
  // one however early it happens. Both roads are watched: a throw arrives
  // as an error event, an async boot step that died arrives as an
  // unhandled rejection, and WebKit reports module throws as a bare
  // "Script error." besides -- so the full story is in the server's
  // diagnostics log (bench/studio/diagnostics.log), and the banner says
  // what it can.
  function bootFault(message) {
    // Once the studio is up, the same throw means something else
    // entirely: a fault in one handler, on a page that is fully built.
    // Saying "half-built" there sent Param hunting a cached script for a
    // fault that was in a slider's entry box.
    if (window.__studioReady) {
      shout("<b>Something in the studio threw.</b> "
        + (message || "An error was thrown")
        + ". The page is built and the rest of it still works; whatever you "
        + "had just done is the thing that failed. The full story is in "
        + "<code>bench/studio/diagnostics.log</code>.");
      return;
    }
    shout("<b>The studio stopped setting itself up.</b> "
      + (message || "An error was thrown")
      + ". The panel is half-built. If the build stamp above is not the one "
      + "you expect, this is a cached script: hard-reload (Ctrl+Shift+R on "
      + "a computer, or clear this site's data on a tablet).");
  }
  window.addEventListener("error", function (event) {
    bootFault(event && event.message);
  });
  window.addEventListener("unhandledrejection", function (event) {
    // Only while the studio is still assembling itself: a stray rejection
    // during ordinary use is studio.js's own diagnostics' business, and a
    // "half-built" banner over a fully built page would be a lie.
    if (window.__studioReady) return;
    var reason = event && event.reason;
    bootFault(reason && reason.message ? reason.message : String(reason || ""));
  });
}());
</script>
<script type="module" src="/static/studio.js"></script>
</body>
</html>
