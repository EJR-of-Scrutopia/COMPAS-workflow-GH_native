<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bench Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/studio.css">
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="event-log"></div>
<div id="banner" class="hidden"><span id="banner-text"></span><span id="banner-close">&#10005;</span></div>
<div id="cut-overlay" class="hidden"><div id="cut-spinner"></div><div id="cut-status"></div></div>
<div id="legend" class="hidden">
  <div id="legend-title"></div>
  <div id="legend-bar"></div>
  <div id="legend-labels"><span id="legend-min"></span><span id="legend-zero"></span><span id="legend-max"></span></div>
</div>
<aside id="panel">
  <details id="import-section">
    <summary>Import</summary>
    <div id="folder-row">
      <button id="folder-choose" title="Pick the folder your vault JSONs are saved in">Choose folder</button>
      <span id="folder-path" title="">no folder chosen</span>
    </div>
    <div id="vault-row">
      <select id="study-select"></select>
      <button id="study-refresh" title="Re-read the folder for new saves">Refresh</button>
    </div>
    <div id="vault-tools">
      <button id="live-toggle" class="on" title="Live: follow Grasshopper"><span class="beacon"></span>LIVE</button>
      <button id="delete-study" title="Delete this vault's JSON from the folder">Delete</button>
    </div>
    <div id="source-row" class="hidden">
      <span class="row-heading">Skin</span>
      <div class="switch-line">
        <span class="toggle-end" id="source-end-authored">Grasshopper</span>
        <label class="toggle"><input id="source-toggle" type="checkbox"><span class="track"></span></label>
        <span class="toggle-end" id="source-end-generated">Engine</span>
      </div>
    </div>
    <div id="import-status"></div>
  </details>
  <details id="study-section" open>
    <summary>Skin</summary>
    <button id="material-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Material</span><span class="chevron"></span></button>
    <div id="material-tiles" class="tile-grid hidden"></div>
    <select id="material-select" class="hidden">
      <option value="concrete">Concrete C30/37</option>
      <option value="concrete-c50">Concrete C50/60</option>
      <option value="concrete-sprayed">Sprayed concrete C25/30</option>
      <option value="timber">Timber GL24h</option>
      <option value="brick">Brick masonry</option>
      <option value="tile">Fired clay tile</option>
      <option value="stone">Limestone</option>
    </select>
    <div id="material-folder-row" class="folder-line">
      <button id="material-folder-choose" title="Pick your material library folder">Material folder</button>
      <span id="material-folder-path" title="">no folder chosen</span>
    </div>
    <button id="skin-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Render skin</span><span class="chevron"></span></button>
    <input id="skin-search" type="search" class="hidden" placeholder="Search materials">
    <div id="skin-tiles" class="tile-grid hidden"></div>
    <select id="render-skin" class="hidden">
      <option value="none" selected>None (material)</option>
      <option value="white-presentation">White presentation</option>
      <option value="basalt-dark">Basalt dark</option>
      <option value="timber-ply">Timber ply</option>
    </select>
    <label>Tint <input id="material-tint" type="color" value="#ffffff"></label>
    <label>Shine <input id="material-finish" type="range" min="0.3" max="1" step="0.01" value="0.5"> <span id="material-finish-value">50</span></label>
    <button id="material-reset">Reset appearance</button>
    <div id="appearance-note" class="hidden"></div>
    <div class="named"><span>Pattern</span><select id="pattern-select"></select></div>
    <div id="pattern-note"></div>
    <label>Piece size <input id="size-slider" type="range" min="0.3" max="3" step="0.05" value="0.9">
      <span id="size-value">900</span><span id="size-units"> mm target</span>, <span id="piece-count">0</span> pieces in
      <span id="course-count">0</span> courses</label>
    <label>Thickness <input id="thickness-input" type="range" min="0.1" max="0.4" step="0.01" value="0.2"> <span id="thickness-value">200</span> mm</label>
  </details>
  <details id="analysis-section">
    <summary>Analysis</summary>
    <button id="run-button">Run staged analysis</button>
    <div id="run-status"></div>
    <div id="layer-toggles"></div>
    <label class="named">Stress surface <select id="stress-surface">
      <option value="per" selected>Per surface</option>
      <option value="worst">Worst of both</option>
      <option value="top">Top</option>
      <option value="bottom">Bottom</option>
    </select></label>
    <label>Deflection exaggeration <input id="exaggeration" type="range" min="1" max="500" step="1" value="100"></label>
    <button id="data-button">Data</button>
  </details>
  <details id="animation-section" open>
    <summary>Animation</summary>
    <button id="play-button">Play</button>
    <button id="restart-button">Restart</button>
    <label>Timeline <input id="timeline-scrubber" type="range" min="0" max="1000" step="1" value="0"></label>
    <label>Timeline speed <input id="timeline-speed" type="range" min="0.25" max="4" step="0.05" value="1"> <span id="timeline-speed-value">1.00</span>x</label>
    <label>Spin rate <input id="orbit-speed" type="range" min="0" max="2" step="0.1" value="0.3"></label>
    <button id="record-button">Record 1080p</button>
    <div id="record-status"></div>
  </details>
  <details id="scene-section">
    <summary>Scene</summary>
    <span class="row-heading">Sun</span>
    <div id="sun-block">
      <div id="sun-widget">
        <canvas id="sun-dial" width="186" height="118"></canvas>
        <div id="sun-readout"><span id="sun-time">12:00</span><span id="sun-angles">180 / 60</span></div>
      </div>
      <div id="sun-presets">
        <button class="chip" data-preset="sunrise">Sunrise</button>
        <button class="chip" data-preset="morning">Morning</button>
        <button class="chip" data-preset="noon">Noon</button>
        <button class="chip" data-preset="golden">Golden</button>
        <button class="chip" data-preset="sunset">Sunset</button>
        <button class="chip" data-preset="blue">Blue hour</button>
      </div>
    </div>
    <canvas id="day-track" width="276" height="26"></canvas>
    <div id="day-cycle-row">
      <button id="day-cycle-button">Day cycle</button>
      <label><input id="day-cycle-record" type="checkbox"> During recordings</label>
      <input id="day-cycle-seconds" type="range" min="10" max="120" step="5" value="30" class="hidden">
    </div>
    <input id="sun-azimuth" type="range" min="0" max="360" step="1" value="140" class="hidden">
    <input id="sun-elevation" type="range" min="5" max="85" step="1" value="40" class="hidden">
    <input id="sun-colour" type="color" value="#ffffff" class="hidden">
    <label>Brightness <input id="brightness" type="range" min="0.3" max="2" step="0.05" value="1"></label>
    <label>Contrast <input id="contrast" type="range" min="-0.5" max="0.5" step="0.02" value="0"></label>

    <span class="row-heading">Scenes</span>
    <div id="scene-row">
      <button id="scene-save">Save scene</button>
      <button id="scene-open">Scenes</button>
      <button id="clear-scene" title="Empty the viewport and deselect">Clear scene</button>
      <span id="scene-count"></span>
    </div>
    <div id="scene-list" class="hidden"></div>

    <span class="row-heading">Ground</span>
    <button id="ground-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Surface</span><span class="chevron"></span></button>
    <input id="ground-search" type="search" class="hidden" placeholder="Search surfaces">
    <div id="ground-tiles" class="tile-grid hidden"></div>
    <label class="hidden">Surface <select id="ground-preset">
      <option value="dark-studio" selected>Dark studio</option>
      <option value="concrete-slab">Concrete slab</option>
      <option value="patio-pavers">Patio pavers</option>
      <option value="tiles">Tiles</option>
    </select></label>
    <label>Size <input id="ground-radius" type="range" min="2" max="200" step="1" value="60"> <span id="ground-radius-value">60</span> m radius</label>

    <span class="row-heading">Environment</span>
    <div id="environment-segments" class="segmented"></div>
    <label class="hidden">Setting <select id="environment-mode">
      <option value="studio" selected>Studio</option>
      <option value="sky">Sky</option>
      <option value="hdri">HDRI</option>
    </select></label>
    <button id="weather-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Weather</span><span class="chevron"></span></button>
    <div id="weather-tiles" class="tile-grid hidden hidden"></div>
    <label id="weather-row" class="hidden" style="display:none">Weather <select id="weather-preset">
      <option value="clear" selected>Clear</option>
      <option value="hazy">Hazy</option>
      <option value="overcast">Overcast</option>
      <option value="golden-hour">Golden hour</option>
      <option value="night">Night</option>
    </select></label>
    <div id="hdri-row" class="hidden">
      <div id="hdri-folder-row" class="folder-line">
        <button id="hdri-folder-choose" title="Pick the folder your HDRIs are in">Sky folder</button>
        <span id="hdri-folder-path" title="">no folder chosen</span>
      </div>
      <button id="hdri-picker" class="picker" type="button"><span class="chosen-swatch"></span><span class="chosen-name">Sky</span><span class="chevron"></span></button>
    <div id="hdri-tiles" class="tile-grid hidden"></div>
      <label class="hidden">HDRI <select id="hdri-select"></select></label>
      <div id="hdri-status"></div>
      <label>Projection <select id="hdri-projection">
        <option value="projected" selected>Projected</option>
        <option value="infinite">Infinite</option>
      </select></label>
      <label id="hdri-scale-row">Scale <input id="hdri-scale" type="range" min="10" max="300" step="5" value="60"></label>
      <label id="hdri-height-row">Height <input id="hdri-height" type="range" min="0.5" max="20" step="0.5" value="2"></label>
      <label>Rotation <input id="hdri-rotation" type="range" min="0" max="360" step="1" value="0"></label>
    </div>
    <label id="background-row">Background <input id="background-tone" type="range" min="0" max="100" step="1" value="85"></label>

    <span class="row-heading">Props</span>
    <div id="props-folder-row" class="folder-line">
      <button id="props-folder-choose" title="Pick the folder your prop models are in">Prop folder</button>
      <span id="props-folder-path" title="">no folder chosen</span>
    </div>
    <div id="props-row">
      <button id="prop-browse" title="Choose a prop and carry it">Library</button>
      <button id="props-clear" title="Remove every placed prop">Clear</button>
    </div>
    <div id="prop-library" class="hidden">
      <div id="prop-tiles" class="tile-grid"></div>
      <div id="prop-credit"></div>
    </div>
    <select id="prop-type" class="hidden"></select>
  </details>
  <div id="mode-row">
    <button id="show-formwork" class="mode" title="The net and the machine alone">Formwork</button>
    <button id="show-shell" class="mode" title="The vault alone">Shell</button>
    <button id="show-both" class="mode active" title="The vault on its formwork">Both</button>
  </div>
</aside>
<div id="data-panel" class="hidden"><button id="data-close">Close</button><div id="data-content"></div></div>
<script type="module" src="/static/studio.js"></script>
</body>
</html>
