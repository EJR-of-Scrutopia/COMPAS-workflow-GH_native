<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bench Studio: WebGPU probe</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI Variable Text", system-ui, sans-serif; font-size: 12px;
         background: #101114; color: #e8e8e6; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #report { position: fixed; left: 14px; top: 14px; width: 420px; padding: 12px 14px;
            background: rgba(16, 17, 20, 0.9); border: 1px solid #2a2c31; border-radius: 4px;
            line-height: 1.55; white-space: pre-wrap; }
  b { color: #f2f3f5; font-weight: 600; }
  .bad { color: #e0a03a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/static/vendor/three.webgpu.js",
    "three/webgpu": "/static/vendor/three.webgpu.js",
    "three/tsl": "/static/vendor/three.tsl.js",
    "three/addons/": "/static/vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<pre id="report">starting the WebGPU probe...</pre>
<script type="module">
// A probe, not a studio. It answers three questions Param's machine cannot
// be asked from here, because this sandbox has no GPU: does WebGPU come up
// at all, what adapter is behind it, and do the studio's own materials look
// right under a node-based renderer rather than the WebGL one.
//
// It deliberately does NOT touch studio.js. Switching the studio's renderer
// is a decision with consequences for its postprocessing, its shadows and
// its two render targets, and that decision wants evidence first.
import * as THREE from "three";

const report = document.getElementById("report");
const lines = [];
function say(text, bad) {
  lines.push(bad ? '<span class="bad">' + text + "</span>" : text);
  report.innerHTML = lines.join("\n");
}

if (!navigator.gpu) {
  say("<b>No WebGPU in this browser.</b>", true);
  say("navigator.gpu is undefined, so the studio would fall back to WebGL.");
} else {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) {
    say("<b>WebGPU is present but no adapter answered.</b>", true);
    say("That is what a headless or software-only browser reports.");
  } else {
    const info = adapter.info || {};
    say("<b>WebGPU adapter</b>");
    say("  vendor       " + (info.vendor || "unknown"));
    say("  architecture " + (info.architecture || "unknown"));
    say("  device       " + (info.device || info.description || "unknown"));
    say("  max texture  " + adapter.limits.maxTextureDimension2D);
    say("  features     " + [...adapter.features].slice(0, 6).join(", "));
    say("");

    const canvas = document.getElementById("view");
    const renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
    await renderer.init();
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14161a);
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.up.set(0, 0, 1);
    camera.position.set(9, -11, 5.5);
    camera.lookAt(0, 0, 1.1);

    // The studio's own registry materials, rebuilt here in the same terms.
    const materials = [
      ["concrete", 0x939590, 0.9, 0.0],
      ["concrete C50", 0x5d646c, 0.72, 0.0],
      ["sprayed", 0xcbcbc6, 0.98, 0.0],
      ["timber", 0xb07a3c, 0.55, 0.0],
      ["brick", 0x8c4a32, 0.88, 0.0],
      ["tile", 0xc47a52, 0.45, 0.0],
      ["stone", 0xbfb9a6, 0.8, 0.0],
    ];
    const ball = new THREE.SphereGeometry(0.85, 48, 32);
    materials.forEach(([name, colour, roughness, metalness], index) => {
      const mesh = new THREE.Mesh(ball, new THREE.MeshPhysicalMaterial({
        color: colour, roughness, metalness,
      }));
      mesh.position.set((index - 3) * 2.1, 0, 1.1);
      mesh.castShadow = mesh.receiveShadow = true;
      scene.add(mesh);
    });

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(30, 64),
      new THREE.MeshPhysicalMaterial({ color: 0x22242a, roughness: 0.95 }));
    ground.receiveShadow = true;
    scene.add(ground);

    // The same low warm sun the studio's own model produces at six degrees,
    // so the comparison is like for like.
    const sun = new THREE.DirectionalLight(0xffb76b, 2.6);
    sun.position.set(-14, -18, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);
    scene.add(new THREE.HemisphereLight(0x9fb6d0, 0x30271f, 0.6));

    let frames = 0;
    let since = performance.now();
    let reported = false;
    renderer.setAnimationLoop(() => {
      const t = performance.now() / 1000;
      camera.position.set(Math.cos(t * 0.2) * 13, Math.sin(t * 0.2) * 13, 5.5);
      camera.lookAt(0, 0, 1.1);
      renderer.render(scene, camera);
      frames += 1;
      const elapsed = performance.now() - since;
      if (elapsed > 2000 && !reported) {
        reported = true;
        say("<b>Rendering</b> " + (frames / (elapsed / 1000)).toFixed(0)
          + " frames a second at " + window.innerWidth + " by " + window.innerHeight);
        say("");
        say("The seven balls are the studio's own material registry, under a");
        say("6 degree sun in the colour the solar model gives at that height.");
        say("If this looks right and runs fast, the studio can move.");
      }
    });
  }
}
</script>
</body>
</html>
